name: Geçici Biçim Kesin Doğrulama

on:
  pull_request:

permissions:
  contents: read

jobs:
  dogrula:
    runs-on: windows-latest
    steps:
      - name: Branch biçimini doğrula
        shell: pwsh
        run: |
          git clone --branch agent/ilk-moduler-iskelet --depth 1 https://github.com/${{ github.repository }} kaynak 2>$null
          Set-Location kaynak
          cargo fmt --all --check
