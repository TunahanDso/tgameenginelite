name: Geçici Doku Biçim

on:
  pull_request:

permissions:
  contents: write

jobs:
  bicimlendir:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ilk-moduler-iskelet
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Değişiklikleri gönder
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) { exit 0 }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "Dokulu malzeme kaynaklarını biçimlendir"
          git push origin HEAD:agent/ilk-moduler-iskelet
