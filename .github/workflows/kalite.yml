name: Kalite

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  denetim:
    name: Rust derleyici tanısı
    runs-on: windows-latest

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Rust araç zincirini kur
        uses: dtolnay/rust-toolchain@stable

      - name: Derleyici hatalarını göster
        shell: pwsh
        run: |
          $satirlar = cargo check --workspace --all-targets --message-format=json 2>$null
          $hataVar = $false
          foreach ($satir in $satirlar) {
            try { $mesaj = $satir | ConvertFrom-Json } catch { continue }
            if ($mesaj.reason -eq 'compiler-message' -and $mesaj.message.level -eq 'error') {
              $hataVar = $true
              Write-Host $mesaj.message.rendered
            }
          }
          if ($hataVar) { exit 1 }
