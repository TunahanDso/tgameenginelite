name: Kalite

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  baglanti:
    if: github.actor != 'github-actions[bot]'
    name: Motor bağlantı commit'i
    runs-on: windows-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
        with:
          ref: agent/ilk-moduler-iskelet

      - name: Rust araç zincirini kur
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Bağlantı betiğini çalıştır
        run: python tools/gecici_bagla.py

      - name: Kaynakları biçimlendir
        run: cargo fmt --all

      - name: Bağlantı commit'ini gönder
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) { exit 0 }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates examples Cargo.toml
          git commit -m "UI doğal dünya savaş AI ve ses olaylarını bağla"
          git push origin HEAD:agent/ilk-moduler-iskelet
