name: Kalite

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  denetim:
    if: github.actor != 'github-actions[bot]'
    name: Büyük sürüm kalite denetimi
    runs-on: windows-latest

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
        with:
          ref: agent/ilk-moduler-iskelet

      - name: Rust araç zincirini kur
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: glTF node dolaşımını kopyasız yap
        shell: pwsh
        run: |
          $yol = 'crates/tgame-model/src/lib.rs'
          $icerik = [IO.File]::ReadAllText($yol)
          $icerik = $icerik.Replace(
            '                    dugum,',
            '                    &dugum,'
          )
          $icerik = $icerik.Replace(
            '    dugum: gltf::Node<''_>,',
            '    dugum: &gltf::Node<''_>,'
          )
          $icerik = $icerik.Replace(
            'dugum_orneklerini_topla(cocuk, dunya_matrisi, primitive_eslemeleri, hedef)?;',
            'dugum_orneklerini_topla(&cocuk, dunya_matrisi, primitive_eslemeleri, hedef)?;'
          )
          if (-not $icerik.Contains('dugum: &gltf::Node')) { throw 'Node referans dönüşümü uygulanamadı.' }
          [IO.File]::WriteAllText($yol, $icerik, [Text.UTF8Encoding]::new($false))
          cargo fmt --all
          Remove-Item 'clippy-hatalari.txt' -ErrorAction SilentlyContinue
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- $yol clippy-hatalari.txt
          if (git status --porcelain) {
            git commit -m "glTF node dolaşımını referansla yap"
            git push origin HEAD:agent/ilk-moduler-iskelet
          }

      - name: Biçimi denetle
        run: cargo fmt --all --check

      - name: Workspace'i denetle
        run: cargo check --workspace --all-targets

      - name: Clippy denetimini çalıştır
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Testleri çalıştır
        run: cargo test --workspace --all-targets --all-features
