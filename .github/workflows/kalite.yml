name: Kalite

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  denetim:
    if: github.actor != 'github-actions[bot]'
    name: Rust derleyici tanısı
    runs-on: windows-latest

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
        with:
          ref: agent/ilk-moduler-iskelet

      - name: Rust araç zincirini kur
        uses: dtolnay/rust-toolchain@stable

      - name: Derleyici hatalarını kaydet
        shell: pwsh
        run: |
          $satirlar = cargo check --workspace --all-targets --message-format=json 2>$null
          $hatalar = [System.Collections.Generic.List[string]]::new()
          foreach ($satir in $satirlar) {
            try { $mesaj = $satir | ConvertFrom-Json } catch { continue }
            if ($mesaj.reason -eq 'compiler-message' -and $mesaj.message.level -eq 'error') {
              $hatalar.Add([string]$mesaj.message.rendered)
            }
          }
          if ($hatalar.Count -eq 0) {
            $hatalar.Add('DERLEYICI_TEMIZ')
          }
          [IO.File]::WriteAllText(
            'derleyici-hatalari.txt',
            ($hatalar -join "`n`n"),
            [Text.UTF8Encoding]::new($false)
          )
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add derleyici-hatalari.txt
          git commit -m "Derleyici tanı sonuçlarını kaydet"
          git push origin HEAD:agent/ilk-moduler-iskelet
          if ($hatalar[0] -ne 'DERLEYICI_TEMIZ') { exit 1 }
