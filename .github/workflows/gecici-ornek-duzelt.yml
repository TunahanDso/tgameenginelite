name: Gecici Ornek Duzelt

on:
  push:
    branches:
      - agent/ilk-moduler-iskelet

permissions:
  contents: write

jobs:
  duzelt:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ilk-moduler-iskelet
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Ana oyun dosyasini modullestir
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          yol = Path("examples/ilk-oyun/src/main.rs")
          metin = yol.read_text(encoding="utf-8")
          yeni_bas = '''mod macera_icerigi;

          use macera_icerigi::{MaceraKimlikleri, macerayi_olustur};
          use tgame::onsoz::{
              Donusum3B, Dunya, FizikDunyasi, FizikGovdesi, Girdi, GorevAsamasi,
              GorevIlerlemesi, Kamera3B, KayitYoneticisi, Macera, MalzemeKimligi,
              MalzemeVerisi, MeshKimligi, ModelVerisi, Oyun, OyunAkisi, OyunHatasi,
              OyunSonucu, Renk, Sahne, SahneKimligi, Tus, Varlik, VarlikKimligi,
              Vektor3, Zaman,
          };

          '''
          metin, sayi = re.subn(r'use tgame::onsoz::\{.*?\};\n\n', yeni_bas, metin, count=1, flags=re.S)
          assert sayi == 1, "İçe aktarma bloğu bulunamadı"
          metin, sayi = re.subn(
              r'#\[derive\(Clone\)\]\nstruct MaceraKimlikleri \{.*?\n\}\n\nimpl MaceraKimlikleri \{.*?\n\}\n\n',
              '',
              metin,
              count=1,
              flags=re.S,
          )
          assert sayi == 1, "Eski kimlik yapısı bulunamadı"
          metin = metin.replace(
              'if self.diyalog_girdisini_isle(girdi, macera) {',
              'if Self::diyalog_girdisini_isle(girdi, macera) {',
          )
          metin = metin.replace(
              'fn diyalog_girdisini_isle(&self, girdi: &Girdi, macera: &mut Macera) -> bool {',
              'fn diyalog_girdisini_isle(girdi: &Girdi, macera: &mut Macera) -> bool {',
          )
          metin = metin.replace(
              'gecis.onceki.as_ref().map(|sahne| sahne.deger()),',
              'gecis.onceki.as_ref().map(SahneKimligi::deger),',
          )
          metin = metin.replace(
              'ilerleme.map_or(0, |ilerleme| ilerleme.adim())',
              'ilerleme.map_or(0, GorevIlerlemesi::adim)',
          )
          metin = metin.replace(
              'ilerleme.map_or(&[][..], |ilerleme| ilerleme.hedefler())',
              'ilerleme.map_or(&[][..], GorevIlerlemesi::hedefler)',
          )
          eski_sure = '''        println!(
              "Unvan: {} — bölüm tamamlandı: {} — oynama: {:.1} sn",
              macera.durum().metin("oyuncu_unvani").unwrap_or("Yolcu"),
              macera.durum().bayrak("bolum_tamamlandi"),
              macera.oynama_suresi_milisaniye() as f64 / 1_000.0
          );'''
          yeni_sure = '''        let oynama_milisaniye = macera.oynama_suresi_milisaniye();
          println!(
              "Unvan: {} — bölüm tamamlandı: {} — oynama: {}.{:03} sn",
              macera.durum().metin("oyuncu_unvani").unwrap_or("Yolcu"),
              macera.durum().bayrak("bolum_tamamlandi"),
              oynama_milisaniye / 1_000,
              oynama_milisaniye % 1_000,
          );'''
          assert eski_sure in metin, "Süre yazdırma bloğu bulunamadı"
          metin = metin.replace(eski_sure, yeni_sure)
          metin, sayi = re.subn(
              r'\nfn macerayi_olustur\(kimlikler: &MaceraKimlikleri\) -> OyunSonucu<Macera> \{.*?\n\}\n\nfn diyalogu_yazdir',
              '\nfn diyalogu_yazdir',
              metin,
              count=1,
              flags=re.S,
          )
          assert sayi == 1, "Eski macera kurulum fonksiyonu bulunamadı"
          yol.write_text(metin, encoding="utf-8", newline="\n")
          '@ | python -
          cargo fmt --all
          cargo check --workspace --all-targets
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-targets --all-features
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "Ornek macera oyununu modullestir ve kalite hatalarini duzelt"
          git push origin HEAD:agent/ilk-moduler-iskelet
