name: Geçici Otomatik Biçim

on:
  push:
    branches:
      - agent/ilk-moduler-iskelet
  pull_request:

permissions:
  contents: write

jobs:
  bicimlendir:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
        with:
          ref: agent/ilk-moduler-iskelet

      - name: Rustfmt kur
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Rust kaynaklarını biçimlendir
        run: cargo fmt --all

      - name: Biçim değişikliklerini gönder
        shell: pwsh
        run: |
          if (-not (git status --porcelain -- '*.rs')) {
            Write-Host "Biçim değişikliği yok."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "Girdi ve zaman kaynaklarını biçimlendir"
          git push origin HEAD:agent/ilk-moduler-iskelet
