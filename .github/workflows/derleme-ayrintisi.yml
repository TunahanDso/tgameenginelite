name: Derleme Ayrıntısı

on:
  push:
    branches:
      - agent/ilk-moduler-iskelet
  pull_request:

permissions:
  contents: read

jobs:
  ayrinti:
    name: Derleyici hatasını göster
    runs-on: windows-latest

    steps:
      - name: Repoyu al ve derlemeyi denetle
        shell: pwsh
        run: |
          git clone --branch agent/ilk-moduler-iskelet --depth 1 https://github.com/${{ github.repository }} kaynak
          Set-Location kaynak
          $cikti = cargo check --workspace --all-targets 2>&1
          $kod = $LASTEXITCODE
          $cikti | Where-Object {
            $_ -match '^error' -or
            $_ -match '^\s*-->' -or
            $_ -match '^\s*= (help|note)' -or
            $_ -match 'expected|found|unknown field|no method|mismatched types|cannot|not found'
          } | Select-Object -Last 80
          exit $kod
