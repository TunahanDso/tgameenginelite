name: Derleme Ayrıntısı

on:
  push:
    branches:
      - agent/ilk-moduler-iskelet
  pull_request:

permissions:
  contents: read

jobs:
  ayrinti:
    name: Derleyici hatasını göster
    runs-on: windows-latest

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
        with:
          ref: agent/ilk-moduler-iskelet

      - name: Rust araç zincirini kur
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo önbelleğini hazırla
        uses: Swatinem/rust-cache@v2

      - name: Derleyici hatalarını göster
        shell: pwsh
        run: |
          $json = cargo check --workspace --all-targets --message-format=json 2>$null
          $kod = $LASTEXITCODE
          $json | ForEach-Object {
            try {
              $mesaj = $_ | ConvertFrom-Json
              if ($mesaj.reason -eq "compiler-message" -and $mesaj.message.level -eq "error") {
                Write-Host $mesaj.message.rendered
              }
            } catch {
            }
          }
          exit $kod
