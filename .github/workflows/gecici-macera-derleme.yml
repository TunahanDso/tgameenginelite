name: Gecici Macera Derleme

on:
  push:
    branches:
      - agent/ilk-moduler-iskelet

permissions:
  contents: write

jobs:
  tani:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ilk-moduler-iskelet
      - uses: dtolnay/rust-toolchain@stable
      - name: Derleme hatalarini kaydet
        shell: pwsh
        run: |
          $satirlar = cargo check --workspace --all-targets --message-format=json 2>$null
          $hatalar = [System.Collections.Generic.List[string]]::new()
          foreach ($satir in $satirlar) {
            try { $mesaj = $satir | ConvertFrom-Json } catch { continue }
            if ($mesaj.reason -eq 'compiler-message' -and $mesaj.message.level -eq 'error') {
              $hatalar.Add([string]$mesaj.message.rendered)
            }
          }
          if ($hatalar.Count -eq 0) { $hatalar.Add('DERLEME_TEMIZ') }
          [IO.File]::WriteAllText('macera-derleme-hatalari.txt', ($hatalar -join "`n`n"), [Text.UTF8Encoding]::new($false))
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add macera-derleme-hatalari.txt
          git commit -m "Macera derleme tani sonucunu kaydet"
          git push origin HEAD:agent/ilk-moduler-iskelet
