name: Gecici Macera Bicim

on:
  push:
    branches:
      - agent/ilk-moduler-iskelet

permissions:
  contents: write

jobs:
  bicim:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ilk-moduler-iskelet
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - shell: pwsh
        run: |
          Remove-Item '.github/workflows/gecici-macera-bicim.yml'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Macera entegrasyon testlerini bicimlendir"
          git push origin HEAD:agent/ilk-moduler-iskelet
