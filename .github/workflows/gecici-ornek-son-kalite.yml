name: Gecici Ornek Son Kalite

on:
  push:
    branches:
      - agent/ilk-moduler-iskelet

permissions:
  contents: write

jobs:
  kalite:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ilk-moduler-iskelet
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Kaynaklari duzelt ve kaliteyi kaydet
        shell: pwsh
        run: |
          $oyunYolu = 'examples/ilk-oyun/src/oyun.rs'
          $oyun = [IO.File]::ReadAllText($oyunYolu)
          $oyun = $oyun.Replace(
            'use sahne::{OYUNCU_OLCEGI, SahneKurulumu, sahneyi_olustur};',
            'use sahne::{SahneKurulumu, sahneyi_olustur};'
          )
          $oyun = $oyun.Replace(
            'self.kontrol_girdisini_isle(girdi, macera);',
            'Self::kontrol_girdisini_isle(girdi, macera);'
          )
          $oyun = $oyun.Replace(
            'fn kontrol_girdisini_isle(&self, girdi: &Girdi, macera: &mut Macera) {',
            'fn kontrol_girdisini_isle(girdi: &Girdi, macera: &mut Macera) {'
          )
          $eskiYukleme = @'
          let giris = kontrol
              .as_ref()
              .and_then(|kontrol| kontrol.giris_noktasi.as_deref())
              .or_else(|| self.varsayilan_giris(macera));
          let konum = giris
              .and_then(|ad| macera.etkin_giris_konumu(ad))
              .unwrap_or(Vektor3::yeni(0.0, 2.5, 3.0));
          '@
          $yeniYukleme = @'
          let giris = kontrol
              .as_ref()
              .and_then(|kontrol| kontrol.giris_noktasi.as_deref())
              .unwrap_or_else(|| self.varsayilan_giris(macera));
          let konum = macera
              .etkin_giris_konumu(giris)
              .unwrap_or(Vektor3::yeni(0.0, 2.5, 3.0));
          '@
          $oyun = $oyun.Replace($eskiYukleme.Trim(), $yeniYukleme.Trim())
          $oyun = $oyun.Replace(
            'fn varsayilan_giris(&self, macera: &Macera) -> Option<&''static str> {',
            'fn varsayilan_giris(&self, macera: &Macera) -> &''static str {'
          )
          $oyun = $oyun.Replace('Some("sunak")', '"sunak"')
          $oyun = $oyun.Replace('Some("baslangic")', '"baslangic"')
          [IO.File]::WriteAllText($oyunYolu, $oyun, [Text.UTF8Encoding]::new($false))

          $icerikYolu = 'examples/ilk-oyun/src/macera_icerigi.rs'
          $icerik = [IO.File]::ReadAllText($icerikYolu)
          $icerik = $icerik.Replace(
            'Vektor3::yeni(2.4, 0.0, -3.2)',
            'Vektor3::yeni(2.4, 0.0, -2.4)'
          )
          [IO.File]::WriteAllText($icerikYolu, $icerik, [Text.UTF8Encoding]::new($false))

          $sahneYolu = 'examples/ilk-oyun/src/sahne.rs'
          $sahne = [IO.File]::ReadAllText($sahneYolu)
          $sahne = $sahne.Replace(
            'pub(crate) const OYUNCU_OLCEGI:',
            'const OYUNCU_OLCEGI:'
          )
          [IO.File]::WriteAllText($sahneYolu, $sahne, [Text.UTF8Encoding]::new($false))

          cargo fmt --all
          $sonuc = [System.Collections.Generic.List[string]]::new()
          cargo check --workspace --all-targets 2>&1 | ForEach-Object { $sonuc.Add([string]$_) }
          $check = $LASTEXITCODE
          cargo clippy --workspace --all-targets --all-features -- -D warnings 2>&1 | ForEach-Object { $sonuc.Add([string]$_) }
          $clippy = $LASTEXITCODE
          cargo test --workspace --all-targets --all-features 2>&1 | ForEach-Object { $sonuc.Add([string]$_) }
          $test = $LASTEXITCODE
          $sonuc.Add("CHECK=$check CLIPPY=$clippy TEST=$test")
          [IO.File]::WriteAllText('ornek-son-kalite.txt', ($sonuc -join "`n"), [Text.UTF8Encoding]::new($false))

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/ilk-oyun/src/oyun.rs examples/ilk-oyun/src/macera_icerigi.rs examples/ilk-oyun/src/sahne.rs ornek-son-kalite.txt
          git commit -m "Moduler ornek macerayi kalite kapilarindan gecir"
          git push origin HEAD:agent/ilk-moduler-iskelet
          if ($check -ne 0 -or $clippy -ne 0 -or $test -ne 0) { exit 1 }
