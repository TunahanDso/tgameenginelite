name: Geçici Doku Düzeltme

on:
  pull_request:

permissions:
  contents: write

jobs:
  duzelt:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ilk-moduler-iskelet
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Clippy önerilerini uygula
        shell: pwsh
        run: |
          $yol = 'crates/tgame-model/src/lib.rs'
          $icerik = [IO.File]::ReadAllText($yol)
          $eskiUv = @'
                let uvler = okuyucu
                    .read_tex_coords(0)
                    .map(|uvler| {
                        uvler
                            .into_f32()
                            .map(|uv| Vektor2::yeni(uv[0], uv[1]))
                            .collect::<Vec<_>>()
                    })
                    .unwrap_or_else(|| vec![Vektor2::SIFIR; konumlar.len()]);
'@
          $yeniUv = @'
                let uvler = okuyucu.read_tex_coords(0).map_or_else(
                    || vec![Vektor2::SIFIR; konumlar.len()],
                    |uvler| {
                        uvler
                            .into_f32()
                            .map(|uv| Vektor2::yeni(uv[0], uv[1]))
                            .collect::<Vec<_>>()
                    },
                );
'@
          $icerik = $icerik.Replace($eskiUv, $yeniUv)
          $icerik = $icerik.Replace(
            '        let ornekleyici = gltf_ornekleyicisini_cevir(doku.sampler());',
            "        let ornekleyici_kaynagi = doku.sampler();`n        let ornekleyici = gltf_ornekleyicisini_cevir(&ornekleyici_kaynagi);"
          )
          $icerik = $icerik.Replace(
            "fn gltf_ornekleyicisini_cevir(ornekleyici: gltf::texture::Sampler<'_>) -> OrnekleyiciVerisi {",
            "fn gltf_ornekleyicisini_cevir(ornekleyici: &gltf::texture::Sampler<'_>) -> OrnekleyiciVerisi {"
          )
          [IO.File]::WriteAllText($yol, $icerik, [Text.UTF8Encoding]::new($false))
          cargo fmt --all
      - name: Değişiklikleri gönder
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) { exit 0 }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "Clippy doku yükleme önerilerini uygula"
          git push origin HEAD:agent/ilk-moduler-iskelet
