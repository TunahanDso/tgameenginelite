name: Geçici Mesh Biçim

on:
  pull_request:

permissions:
  contents: write

jobs:
  bicimlendir:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ilk-moduler-iskelet
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Unicode benzer karakteri temizle
        shell: pwsh
        run: |
          $yol = 'examples/ilk-oyun/src/main.rs'
          $icerik = Get-Content -Raw -Encoding utf8 $yol
          $icerik = $icerik.Replace('carpismа_olcegi', 'carpisma_olcegi')
          Set-Content -NoNewline -Encoding utf8 $yol $icerik
      - run: cargo fmt --all
      - name: Değişiklikleri gönder
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) { exit 0 }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "Genel mesh ve glTF kaynaklarını biçimlendir"
          git push origin HEAD:agent/ilk-moduler-iskelet
