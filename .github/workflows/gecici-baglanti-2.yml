name: Gecici Baglanti 2

on:
  push:
    branches:
      - agent/ilk-moduler-iskelet

permissions:
  contents: write

jobs:
  bagla:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ilk-moduler-iskelet
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Bağlantı betiğini çalıştır
        run: python tools/gecici_bagla.py
      - run: cargo fmt --all
      - name: Değişiklikleri gönder
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) { exit 0 }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates examples Cargo.toml
          git commit -m "UI doğal dünya savaş AI ve ses olaylarını bağla"
          git push origin HEAD:agent/ilk-moduler-iskelet
