name: Geçici Biçim Ayrıntısı

on:
  pull_request:

permissions:
  contents: read

jobs:
  ayrinti:
    runs-on: windows-latest

    steps:
      - name: Yalnızca rustfmt farklarını göster
        shell: pwsh
        run: |
          git clone --branch agent/ilk-moduler-iskelet --depth 1 https://github.com/${{ github.repository }} kaynak 2>$null
          Set-Location kaynak
          cargo fmt --all --check
